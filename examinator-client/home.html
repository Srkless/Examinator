<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Examintor - Početna</title>
  <link rel="stylesheet" href="homeStyles.css"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
</head>
<body>

  <!-- Pocetak header-a -->
  <header class="main-header">
   <a href="home.html" class="logo">Examinator</a>
    <div class="user-menu" id="userMenu">
    <div class="user-icon" id="userIcon">
      <span class="material-icons">account_circle</span>
      <span class="material-icons arrow">expand_more</span>
    </div>
    <ul class="dropdown" id="dropdownMenu">
      <li>
        <a href="settings.html">
          Podešavanja
          <span class="material-icons">settings</span>
        </a>
      </li>
      <li>
        <a href="logout.html">
          Odjava
          <span class="material-icons">logout</span>
        </a>
      </li>
    </ul>
    </div>
  </header>
  <!-- Kraj header-a -->

  <main class="main-content">
    <h2 id="subject-title" hidden>Predmeti</h2>
    <p id="no-subjects">Trenutno nemate ni jedan predmet</p>
    <table id="subjects-table" hidden>
      <tbody id="subjects-body">
      </tbody>
    </table>
  </main>

  <button id="add-subject" class="add-button">
    <span class="material-icons">add</span>
  </button>

  <!-- Dialog box za dodavanje/izmjenu predmeta -->
  <dialog id="dialog">
  <form method="dialog" id="subject-form">
    <div class="dialog-header">
      <h3 id="dialogTitle">Dodavanje novog predmeta</h3>
      <button type="button" id="close-dialog" class="close-btn">
        <span class="material-icons">close</span>
      </button>
    </div>
    <label>
      Naziv predmeta
      <input type="text" id="subject-name" required />
    </label>
    <label>
      Šifra predmeta
      <input type="text" id="subject-code" required />
    </label>
    <div class="buttons">
      <button type="button" id="cancel-btn">Odustani</button>
      <button type="submit">Potvrdi</button>
    </div>
  </form>
</dialog>
<!-- Kraj dialog box-a za dodavanje/izmjenu predmeta -->


<!-- Dialog box za dodavanje predavaca-->
 <dialog id="professors-dialog">
  <form id="professors-form">
    <div class="dialog-header">
      <h3>Dodavanje predavača</h3>
      <button type="button" id="close-professors-dialog" class="close-btn">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="add-professor-row">
      <label for="professor-select">Predavač</label>
      <select id="professor-select">
        <option value="" disabled selected>Izaberite predavača</option>
      </select>
      <button type="button" id="add-professor">Dodaj</button>
    </div>

    <p id="no-professors" class="no-data-msg">Trenutno nema ni jedan predavač na predmetu</p>

    <div class="professor-table-container">
      <table id="professor-table" hidden>
        <thead>
          <tr>
            <th>Ime</th>
            <th>Prezime</th>
            <th>Email</th>
            <th>Akcija</th>
          </tr>
        </thead>
        <tbody id="professor-body"></tbody>
      </table>
    </div>

    <div class="buttons bottom-buttons">
      <button type="button" class="cancel-btn" id="cancel-professors">Otkaži</button>
      <button type="submit" class="confirm-btn">Sačuvaj</button>
    </div>
  </form>
</dialog>
<!-- Kraj dialog box-a za dodavanje predavaca-->



<!-- Dialog box za unos rezultata -->
<dialog id="results-dialog">
  <form id="results-form" method="dialog">
    <div class="dialog-header">
      <h3>Unos rezultata</h3>
      <button class="close-btn" type="button" id="close-results-dialog">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="results-row">
      <label for="subject">Naziv predmeta</label>
      <input type="text" id="subject" readonly />
    </div>

    <div class="results-row">
      <label for="schoolYear">Školska godina</label>
      <select id="schoolYear" required>
        <option value="" disabled selected>Izaberite školsku godinu</option>
      </select>
    </div>

    <div class="results-row">
      <label for="activity-select">Aktivnost</label>
      <select id="activity-select" required>
        <option value="" disabled selected>Izaberite aktivnost</option>
      </select>
    </div>

    <div class="bottom-buttons">
      <button type="button" id="cancel-results">Otkazati</button>
      <button type="submit" id="confirm-results">Potvrditi</button>
    </div>
  </form>
</dialog>
<!-- Kraj dialog box-a za unos rezultata -->

<script src="scriptHome.js"></script>
</body>
</html>
